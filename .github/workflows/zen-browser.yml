name: Zen Browser

on:
  push:
    paths:
      - 'plugins/zen-browser/**'
      - '.github/workflows/zen-browser.yml'
      - '.agents/plugins/marketplace.json'
  pull_request:
    paths:
      - 'plugins/zen-browser/**'
      - '.github/workflows/zen-browser.yml'
      - '.agents/plugins/marketplace.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/zen-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/zen-browser/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run package
      - name: Verify extension ZIP integrity
        run: python -m zipfile -t dist/zen-browser-extension-0.1.0-unsigned.xpi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zen-browser-${{ matrix.os }}
          path: plugins/zen-browser/dist/
          if-no-files-found: error

  # Live Zen tests require an installed Zen binary and an interactive Windows
  # desktop. They are intentionally separate from these protocol/package checks.
