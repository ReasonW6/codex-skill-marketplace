<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连接 Zen</title>
<style>
  :root{color-scheme:light dark;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#fff;--text:#252927;--muted:#69716c;--line:#e5e9e6;--soft:#f5f7f5;--green:#356b58;--button-text:#fff}
  @media(prefers-color-scheme:dark){:root{--bg:#202320;--text:#f0f3ef;--muted:#aab3ab;--line:#3c443d;--soft:#2a302b;--green:#91c7ac;--button-text:#153d2a}}
  :root[data-theme=light]{color-scheme:light;--bg:#fff;--text:#252927;--muted:#69716c;--line:#e5e9e6;--soft:#f5f7f5;--green:#356b58;--button-text:#fff}
  :root[data-theme=dark]{color-scheme:dark;--bg:#202320;--text:#f0f3ef;--muted:#aab3ab;--line:#3c443d;--soft:#2a302b;--green:#91c7ac;--button-text:#153d2a}
  *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text)}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #85b79a;outline-offset:3px}main{max-width:640px;margin:auto;padding:25px 24px 20px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:43px;height:43px;flex:none}h1{font-size:19px;line-height:1.25;letter-spacing:-.3px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin:4px 0 0}.status{display:flex;align-items:center;gap:8px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:#8f9a93}.status[data-state=connected] .dot{background:#52a878}.status[data-state=connecting] .dot{background:#c49342}.status[data-state=failed] .dot{background:#d26b65}.reason{color:var(--muted);margin:9px 0 24px;min-height:22px;overflow-wrap:anywhere}.choices{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}.field{padding:14px 0;display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;align-items:center}.field+.field{border-top:1px solid var(--line)}label{color:var(--muted);font-size:12px}select{width:100%;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:38px}.selected{font-weight:550;overflow-wrap:anywhere}.tag{display:inline-block;font-size:10px;color:var(--green);margin-left:7px;font-weight:500}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:var(--green);color:var(--button-text);border:1px solid var(--green);border-radius:9px;padding:10px 19px;font-weight:650;min-height:42px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 15px;min-height:42px}.quiet{border:0;background:none;color:var(--muted);padding:5px 0;font-size:12px}.note{font-size:12px;color:var(--muted);margin:19px 0 0}.success{margin:20px 0 0;padding:15px 17px;background:var(--soft);border-radius:10px}.success p{margin:0}.success .example{font-size:13px;margin-top:7px;color:var(--green)}details{font-size:12px;color:var(--muted);margin-top:21px}summary{cursor:pointer}.paths{margin:9px 0;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,monospace}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.error-code{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.confirm{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:25px 24px}.confirm-inner{max-width:592px;margin:0 auto}.confirm h2{font-size:18px;margin:0 0 9px}.confirm .for{color:var(--muted);margin:0 0 18px}.confirm ul{padding-left:20px;margin:0 0 23px}.confirm li+li{margin-top:12px}.confirm .actions{padding-top:5px}.progress{font-size:12px;color:var(--muted);margin:18px 0 0}.recovery{margin-top:14px}.starting{padding:25px;color:var(--muted)}
  @media(max-width:380px){main,.confirm{padding:20px 16px}.field{grid-template-columns:58px minmax(0,1fr)}.primary{padding-inline:14px}.actions{gap:7px}}
</style>
<main>
  <header><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#356b58"/><path d="M12 11h17L12 29h17" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>Zen Browser</h1><p class="subtitle">连接真实浏览器，继续使用已有登录会话</p></div></header>
  <div id="status" class="status" data-state="disconnected" role="status" aria-live="polite"><span class="dot"></span><span id="label">正在检测</span></div>
  <p id="reason" class="reason">正在与 Codex 连接，随后自动检测 Zen。</p>
  <section id="choices" class="choices" aria-label="浏览器与配置" hidden>
    <div class="field"><label for="browser">浏览器</label><div><select id="browser" aria-label="选择 Zen 浏览器"></select><span id="browser-name" class="selected" hidden></span></div></div>
    <div class="field"><label for="profile">配置</label><div><select id="profile" aria-label="选择 Zen 配置"></select><span id="profile-name" class="selected" hidden></span></div></div>
  </section>
  <div class="actions"><button id="connect" class="primary" disabled>连接 Zen</button><button id="resume" class="primary" hidden>引导已完成，继续连接</button><button id="refresh" class="secondary" disabled>重新检测</button><button id="cancel" class="secondary" hidden>取消连接</button></div>
  <div id="success" class="success" hidden><p>连接已就绪</p><p class="example">例如，“帮我在 Zen 中查找资料，打开页面后继续操作。”</p></div>
  <p id="note" class="note">首次连接会说明必要设置。无需运行脚本、寻找路径或另装运行时。</p>
  <div id="recovery" class="recovery" hidden><button id="rollback" class="quiet">恢复连接前的设置</button></div>
  <details><summary>连接详情</summary><div id="paths" class="paths"></div><div id="error-code" class="error-code"></div><div class="foot"><span>仅本机通信</span><span id="version"></span></div></details>
</main>
<section id="confirm" class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <div class="confirm-inner"><h2 id="confirm-title">确认连接 Zen</h2><p id="confirm-for" class="for"></p><ul id="changes"></ul><div class="actions"><button id="approve" class="primary">允许并连接</button><button id="back" class="secondary">返回</button></div></div>
</section>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id), pending = new Map();
  let nextId = 0, state = null, confirmation = null, busy = false, timer = null, initialized = false, refreshSerial = 0, returnFocus = 'connect';
  function dialog(visible) { $('confirm').hidden = !visible; document.querySelector('main').inert = visible; }
  function request(method, params) {
    const id = 'zen-ui-' + (++nextId);
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(id); reject(Error('Codex 的连接暂时没有响应，请重新打开连接页。')); }, 45000);
      pending.set(id, { resolve, reject, timeout });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*'); }
  async function call(name, args) {
    const result = await request('tools/call', { name, arguments: args || {} });
    if (result.isError) {
      let message = result.content?.find(item => item.type === 'text')?.text;
      try { const error = JSON.parse(message); message = error.message || message; } catch {}
      throw Error(message || '连接操作失败，请重试。');
    }
    return result;
  }
  function selection() { return { browserId: $('browser').value || undefined, profileId: $('profile').value || undefined }; }
  function options(id, nameId, items, selected, placeholder) {
    const select = $(id), name = $(nameId);
    select.replaceChildren();
    if (!selected) { const option = document.createElement('option'); option.value = ''; option.textContent = placeholder; select.append(option); }
    for (const item of items) { const option = document.createElement('option'); option.value = item.id; option.textContent = item.name + (item.running ? ' · 正在使用' : item.isDefault ? ' · 默认' : ''); option.disabled = item.available === false; select.append(option); }
    select.value = selected || '';
    const only = items.length === 1 && selected;
    select.hidden = !!only; name.hidden = !only;
    if (only) name.textContent = items[0].name + (items[0].running ? ' · 正在使用' : '');
    select.disabled = busy || state?.status === 'connecting';
  }
  function render(next) {
    if (!next) return; state = next;
    $('status').dataset.state = next.status; $('label').textContent = next.label; $('reason').textContent = next.reason;
    $('choices').hidden = !next.browsers.length && !next.profiles.length;
    options('browser', 'browser-name', next.browsers, next.selection.browserId, '选择浏览器');
    options('profile', 'profile-name', next.profiles, next.selection.profileId, '选择要连接的配置');
    $('connect').disabled = busy || !next.canConnect; $('connect').textContent = next.status === 'connected' ? '已连接' : next.status === 'connecting' ? '正在连接…' : next.status === 'failed' ? '重试连接' : '连接 Zen';
    $('refresh').disabled = busy || !next.canRetry; $('cancel').hidden = !next.canCancel;
    $('resume').hidden = !next.browserReadyTicket; $('resume').disabled = busy; $('connect').hidden = !!next.browserReadyTicket;
    $('resume').textContent = next.browserReadyLabel || '引导已完成，继续连接';
    $('success').hidden = next.status !== 'connected'; $('recovery').hidden = !next.canRollback;
    $('rollback').disabled = busy;
    const browser = next.browsers.find(item => item.id === next.selection.browserId), profile = next.profiles.find(item => item.id === next.selection.profileId);
    $('paths').textContent = [browser?.path, profile?.path].filter(Boolean).join('\n');
    $('error-code').textContent = next.error?.code || ''; $('version').textContent = 'v' + (next.version || '');
    $('note').textContent = next.status === 'connected' ? '点击 AI 标签可以观看；实际网页输入或暂停、接管按钮会停止后续写入。' : '首次连接会说明必要设置。无需运行脚本、寻找路径或另装运行时。';
    clearTimeout(timer); timer = setTimeout(() => refresh(false).catch(showError), next.status === 'connecting' ? 700 : 4000);
    notify('ui/notifications/size-changed', { height: Math.ceil(document.documentElement.scrollHeight) });
  }
  function showError(error) {
    busy = false; $('reason').textContent = error.message || '连接失败，请重试。'; $('label').textContent = '连接失败'; $('status').dataset.state = 'failed';
    $('refresh').disabled = false; $('connect').disabled = !state?.canConnect;
  }
  async function refresh(force = true) {
    if (!initialized || busy || !$('confirm').hidden) return;
    const serial = ++refreshSerial;
    const result = await call('zen_connection', { ...selection(), refresh: force });
    if (serial === refreshSerial && !busy && $('confirm').hidden) render(result._meta?.uiState);
  }
  async function prepare(operation) {
    if (busy) return; busy = true; clearTimeout(timer); refreshSerial++; returnFocus = operation === 'rollback' ? 'rollback' : 'connect';
    $('connect').disabled = true; $('refresh').disabled = true;
    try {
      const result = await call('zen_connection_plan', { ...selection(), operation });
      confirmation = { ticket: result._meta?.confirmationTicket, plan: result.structuredContent };
      if (!confirmation.ticket) throw Error('Codex 未提供确认信息，请重新打开连接页。');
      if (!confirmation.plan.needsConfirmation) { await apply(); return; }
      const plan = confirmation.plan;
      $('confirm-title').textContent = operation === 'rollback' ? '恢复连接前的设置' : plan.needsRestart ? '连接需要重新打开 Zen' : '确认连接 Zen';
      $('confirm-for').textContent = plan.browser + ' · ' + plan.profile;
      $('changes').replaceChildren();
      for (const change of plan.changes) { const item = document.createElement('li'); item.textContent = change; $('changes').append(item); }
      $('approve').textContent = operation === 'rollback' ? '确认恢复' : plan.manualExit ? '允许连接，我会正常退出 Zen' : plan.needsRestart ? '允许并重新连接' : '允许并连接';
      dialog(true); $('approve').disabled = false; $('approve').focus();
    } catch (error) { showError(error); }
    finally { busy = false; }
  }
  async function apply() {
    if (!confirmation) return;
    busy = true; $('approve').disabled = true; $('back').disabled = true;
    const ticket = confirmation.ticket; confirmation = null;
    try { const result = await call('zen_connection_apply', { ticket }); dialog(false); busy = false; render(result._meta?.uiState); }
    catch (error) { dialog(false); showError(error); }
    finally { busy = false; $('back').disabled = false; }
  }
  $('connect').onclick = () => prepare('connect'); $('rollback').onclick = () => prepare('rollback');
  $('approve').onclick = apply;
  $('back').onclick = () => { confirmation = null; dialog(false); busy = false; if (state) render(state); $(returnFocus).focus(); };
  $('refresh').onclick = () => refresh(true).catch(showError);
  $('browser').onchange = $('profile').onchange = () => refresh(false).catch(showError);
  $('cancel').onclick = async () => { try { const result = await call('zen_connection_cancel'); render(result._meta?.uiState); } catch (error) { showError(error); } };
  $('resume').onclick = async () => { if (!state?.browserReadyTicket || busy) return; busy = true; $('resume').disabled = true; try { const result = await call('zen_connection_resume', { ticket: state.browserReadyTicket }); busy = false; render(result._meta?.uiState); } catch (error) { showError(error); } finally { busy = false; } };
  document.addEventListener('keydown', event => {
    if ($('confirm').hidden || busy) return;
    if (event.key === 'Escape') $('back').click();
    if (event.key === 'Tab') { event.preventDefault(); (document.activeElement === $('approve') ? $('back') : $('approve')).focus(); }
  });
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
    const message = event.data, waiting = pending.get(message.id);
    if (waiting) { clearTimeout(waiting.timeout); pending.delete(message.id); if (message.error) waiting.reject(Error(message.error.message || 'Codex 请求失败')); else waiting.resolve(message.result); return; }
    if (message.method === 'ui/notifications/tool-result' && !busy && $('confirm').hidden) render(message.params?._meta?.uiState);
    if (message.method === 'ui/notifications/host-context-changed' && message.params?.theme) document.documentElement.dataset.theme = message.params.theme;
  });
  (async () => {
    try {
      const host = await request('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'Zen Browser', version: '0.4.0' }, appCapabilities: {} });
      if (host.hostContext?.theme) document.documentElement.dataset.theme = host.hostContext.theme;
      notify('ui/notifications/initialized', {}); initialized = true; await refresh(true);
    } catch (error) { showError(error); }
  })();
})();
</script>
</html>
