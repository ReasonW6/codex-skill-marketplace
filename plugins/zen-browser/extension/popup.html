<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Zen Browser Bridge</title></head>
<body>
  <header><img src="icon.svg" width="36" height="36" alt=""><div><strong>Zen Browser Bridge</strong><span>让 Codex 在后台处理网页</span></div></header>
  <main>
    <p id="status" role="status">正在读取连接状态…</p>
    <p id="details"></p>
    <button id="toggle" type="button" disabled>连接中…</button>
    <p class="hint">切到正在被控制的标签页，控制会自动释放。暂停会立即释放全部标签页。</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer>本机原生通信 · 无系统鼠标键盘操作</footer>
  <script src="popup.js"></script>
</body>
</html>
